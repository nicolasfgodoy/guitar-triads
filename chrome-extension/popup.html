<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f0d0b;
      color: #e8e2da;
      margin: 0;
      padding: 15px;
    }
    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      border-bottom: 1px solid #3a322a;
      padding-bottom: 8px;
      color: #d4894a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-box {
      background: #1c1812;
      border: 1px solid #3a322a;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3a322a;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: #e8e2da;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #d4894a;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    .hint {
      font-size: 0.75rem;
      color: #8a8078;
      line-height: 1.3;
      margin-top: 10px;
    }
    .btn-action {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #d4894a;
      color: #0f0d0b;
      border: none;
      border-radius: 5px;
      padding: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background-color: #e89a5a;
    }
  </style>
</head>
<body>
  <h2>🎸 Tríades na Guitarra</h2>
  <div class="status-box">
    <div class="toggle-container">
      <span>Exibir Sidebar Flutuante</span>
      <label class="switch">
        <input type="checkbox" id="toggle-sidebar" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-container" style="margin-top: 12px;">
      <span>Som de Acorde ao Clicar</span>
      <label class="switch">
        <input type="checkbox" id="toggle-sound" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <p class="hint">Entre em qualquer cifra no site do <b>Cifra Club</b>. A extensão adicionará uma sidebar na lateral esquerda com todos os acordes convertidos para diagramas de tríades e voicings de 3 cordas interativos.</p>
  <button class="btn-action" id="open-app">Abrir App Completo</button>
  <script src="popup.js"></script>
</body>
</html>
